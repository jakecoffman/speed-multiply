<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Speed Multiply!</title>
<style>
  :root {
    --bg: #1a1a2e;
    --card: #16213e;
    --accent: #e94560;
    --green: #4ecca3;
    --yellow: #f0c929;
    --text: #eee;
    --text-dim: #8899aa;
    --btn-bg: #0f3460;
    --btn-hover: #1a4a7a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  .screen {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    max-width: 440px;
    padding: 20px;
    gap: 20px;
    animation: fadeIn 0.3s ease;
  }
  .screen.active { display: flex; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  h1 {
    font-size: 2rem;
    text-align: center;
  }
  h1 span { color: var(--accent); }

  .subtitle {
    color: var(--text-dim);
    font-size: 1rem;
    text-align: center;
  }

  /* ---- Number Picker ---- */
  .number-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    width: 100%;
    margin-top: 10px;
  }
  .number-grid:first-of-type {
    grid-template-columns: repeat(4, 1fr);
  }

  .pick-btn {
    background: var(--btn-bg);
    color: var(--text);
    border: 2px solid transparent;
    border-radius: 16px;
    font-size: 2rem;
    font-weight: 700;
    padding: 18px 0;
    cursor: pointer;
    transition: all 0.15s;
  }
  .pick-btn:hover, .pick-btn:focus {
    background: var(--btn-hover);
    border-color: var(--accent);
    transform: scale(1.05);
  }
  .pick-btn:active {
    transform: scale(0.97);
  }
  /* "All" button spans 2 cols on the second row */
  .pick-btn.all-btn {
    grid-column: span 3;
    font-size: 1.5rem;
    background: var(--accent);
  }
  .pick-btn.all-btn:hover {
    background: #ff5a78;
    border-color: transparent;
  }

  /* ---- Countdown ---- */
  #countdown-text {
    font-size: 6rem;
    font-weight: 900;
    color: var(--accent);
    animation: pulse 0.6s ease infinite alternate;
  }
  @keyframes pulse {
    from { transform: scale(1); }
    to { transform: scale(1.15); }
  }

  /* ---- Quiz ---- */
  .progress-bar-bg {
    width: 100%;
    height: 8px;
    background: var(--card);
    border-radius: 4px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: var(--green);
    border-radius: 4px;
    transition: width 0.3s;
  }

  .problem {
    font-size: 3.2rem;
    font-weight: 800;
    letter-spacing: 2px;
    text-align: center;
  }

  .answer-display {
    background: var(--card);
    border: 2px solid var(--btn-bg);
    border-radius: 14px;
    width: 100%;
    min-height: 64px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.8rem;
    font-weight: 700;
    letter-spacing: 4px;
    position: relative;
  }
  .answer-display .cursor {
    display: inline-block;
    width: 2px;
    height: 2.2rem;
    background: var(--accent);
    animation: blink 0.7s step-end infinite;
    margin-left: 2px;
  }
  @keyframes blink {
    50% { opacity: 0; }
  }

  .timer-text {
    font-size: 1rem;
    color: var(--text-dim);
  }
  .timer-text.fast { color: var(--green); }
  .timer-text.slow { color: var(--yellow); }

  .numpad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    width: 100%;
  }

  .num-btn {
    background: var(--btn-bg);
    color: var(--text);
    border: none;
    border-radius: 14px;
    font-size: 1.8rem;
    font-weight: 700;
    padding: 16px 0;
    cursor: pointer;
    transition: all 0.12s;
  }
  .num-btn:hover { background: var(--btn-hover); }
  .num-btn:active { transform: scale(0.95); }

  .num-btn.del {
    background: var(--card);
    font-size: 1.3rem;
  }
  .num-btn.submit {
    background: var(--green);
    color: #111;
    font-size: 1.3rem;
  }
  .num-btn.submit:hover { background: #5fe6b6; }

  /* ---- Feedback flash ---- */
  .feedback-overlay {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 5rem;
    font-weight: 900;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s;
    z-index: 100;
  }
  .feedback-overlay .fb-sub {
    font-size: 1.6rem;
    margin-top: 8px;
  }
  .feedback-overlay.show { opacity: 1; }
  .feedback-overlay.correct { background: rgba(78, 204, 163, 0.25); color: var(--green); }
  .feedback-overlay.wrong { background: rgba(233, 69, 96, 0.25); color: var(--accent); }

  /* ---- Results ---- */
  .results-header {
    font-size: 1.8rem;
    font-weight: 800;
    text-align: center;
  }

  .score-summary {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .score-box {
    background: var(--card);
    border-radius: 14px;
    padding: 14px 22px;
    text-align: center;
    min-width: 90px;
  }
  .score-box .num {
    font-size: 2.2rem;
    font-weight: 800;
  }
  .score-box .label {
    font-size: 0.8rem;
    color: var(--text-dim);
    margin-top: 4px;
  }
  .score-box.green .num { color: var(--green); }
  .score-box.yellow .num { color: var(--yellow); }
  .score-box.red .num { color: var(--accent); }

  .results-list {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 45vh;
    overflow-y: auto;
    padding-right: 4px;
  }

  .result-row {
    display: flex;
    align-items: center;
    background: var(--card);
    border-radius: 10px;
    padding: 10px 16px;
    gap: 12px;
    border-left: 4px solid var(--text-dim);
  }
  .result-row.fast { border-left-color: var(--green); }
  .result-row.correct { border-left-color: var(--yellow); }
  .result-row.wrong { border-left-color: var(--accent); }

  .result-row .problem-text {
    font-weight: 700;
    font-size: 1.1rem;
    flex: 1;
  }
  .result-row .answer-text {
    font-size: 0.95rem;
    color: var(--text-dim);
  }
  .result-row .time-text {
    font-size: 0.9rem;
    font-weight: 600;
    min-width: 50px;
    text-align: right;
  }
  .result-row.fast .time-text { color: var(--green); }
  .result-row.correct .time-text { color: var(--yellow); }
  .result-row.wrong .time-text { color: var(--accent); }

  .result-row .icon {
    font-size: 1.3rem;
  }

  .action-btn {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 14px;
    font-size: 1.2rem;
    font-weight: 700;
    padding: 16px 36px;
    cursor: pointer;
    transition: all 0.15s;
    width: 100%;
  }
  .action-btn:hover { background: #ff5a78; transform: scale(1.02); }
  .action-btn:active { transform: scale(0.98); }

  .action-btn.secondary {
    background: var(--btn-bg);
  }
  .action-btn.secondary:hover { background: var(--btn-hover); }

  .btn-row {
    display: flex;
    gap: 10px;
    width: 100%;
  }
  .btn-row .action-btn { flex: 1; }
</style>
</head>
<body>

<!-- ========== SCREEN 1: Pick a number ========== -->
<div id="screen-pick" class="screen active">
  <h1>Speed <span>Multiply!</span></h1>
  <p class="subtitle">Pick a number to practice</p>
  <div class="number-grid">
    <button class="pick-btn" data-num="3">3</button>
    <button class="pick-btn" data-num="4">4</button>
    <button class="pick-btn" data-num="5">5</button>
    <button class="pick-btn" data-num="6">6</button>
    <button class="pick-btn" data-num="7">7</button>
    <button class="pick-btn" data-num="8">8</button>
    <button class="pick-btn" data-num="9">9</button>
    <button class="pick-btn all-btn" data-num="all">All (3–9)</button>
  </div>
</div>

<!-- ========== SCREEN 2: Countdown ========== -->
<div id="screen-countdown" class="screen">
  <div id="countdown-text">3</div>
</div>

<!-- ========== SCREEN 3: Quiz ========== -->
<div id="screen-quiz" class="screen">
  <div class="progress-bar-bg">
    <div class="progress-bar-fill" id="progress-fill" style="width:0%"></div>
  </div>
  <div class="timer-text" id="timer-text">0.0s</div>
  <div class="problem" id="problem-text">7 × 8</div>
  <div class="answer-display" id="answer-display"><span class="cursor"></span></div>
  <div class="numpad" id="numpad">
    <button class="num-btn" data-val="1">1</button>
    <button class="num-btn" data-val="2">2</button>
    <button class="num-btn" data-val="3">3</button>
    <button class="num-btn" data-val="4">4</button>
    <button class="num-btn" data-val="5">5</button>
    <button class="num-btn" data-val="6">6</button>
    <button class="num-btn" data-val="7">7</button>
    <button class="num-btn" data-val="8">8</button>
    <button class="num-btn" data-val="9">9</button>
    <button class="num-btn del" data-val="del">⌫</button>
    <button class="num-btn" data-val="0">0</button>
    <button class="num-btn submit" data-val="go">GO ➜</button>
  </div>
</div>

<!-- ========== Feedback overlay ========== -->
<div class="feedback-overlay" id="feedback">✓</div>

<!-- ========== SCREEN 4: Results ========== -->
<div id="screen-results" class="screen">
  <div class="results-header" id="results-header">Great Job!</div>
  <div class="score-summary" id="score-summary"></div>
  <div class="results-list" id="results-list"></div>
  <div class="btn-row">
    <button class="action-btn secondary" id="btn-home">↩ Home</button>
    <button class="action-btn" id="btn-retry">🔁 Again</button>
  </div>
</div>

<script>
(function() {
  // --- Elements ---
  const screenPick      = document.getElementById('screen-pick');
  const screenCountdown  = document.getElementById('screen-countdown');
  const screenQuiz       = document.getElementById('screen-quiz');
  const screenResults    = document.getElementById('screen-results');
  const countdownText    = document.getElementById('countdown-text');
  const problemText      = document.getElementById('problem-text');
  const answerDisplay    = document.getElementById('answer-display');
  const timerText        = document.getElementById('timer-text');
  const progressFill     = document.getElementById('progress-fill');
  const feedback         = document.getElementById('feedback');
  const scoreSummary     = document.getElementById('score-summary');
  const resultsList      = document.getElementById('results-list');
  const resultsHeader    = document.getElementById('results-header');
  const btnHome          = document.getElementById('btn-home');
  const btnRetry         = document.getElementById('btn-retry');

  const FAST_TIME = 3; // seconds threshold
  const MIN_FACTOR = 1; // multiply chosen number by 1..9
  const MAX_FACTOR = 9;

  let chosenNumber = null;
  let problems = [];
  let currentIndex = 0;
  let currentAnswer = '';
  let questionStart = 0;
  let timerInterval = null;
  let results = []; // { a, b, correct, given, time, isCorrect }

  // --- Helpers ---
  function showScreen(screen) {
    [screenPick, screenCountdown, screenQuiz, screenResults].forEach(s => s.classList.remove('active'));
    screen.classList.add('active');
    // retrigger animation
    screen.style.animation = 'none';
    screen.offsetHeight; // reflow
    screen.style.animation = '';
  }

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function generateProblems(num) {
    const list = [];
    if (num === 'all') {
      for (let n = 3; n <= 9; n++) {
        for (let f = MIN_FACTOR; f <= MAX_FACTOR; f++) {
          list.push([n, f]);
        }
      }
    } else {
      for (let f = MIN_FACTOR; f <= MAX_FACTOR; f++) {
        list.push([num, f]);
      }
    }
    return shuffle(list);
  }

  function updateAnswerDisplay() {
    answerDisplay.innerHTML = currentAnswer
      ? currentAnswer + '<span class="cursor"></span>'
      : '<span class="cursor"></span>';
  }

  function startTimer() {
    questionStart = performance.now();
    timerText.textContent = '0.0s';
    timerText.className = 'timer-text';
    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      const elapsed = (performance.now() - questionStart) / 1000;
      timerText.textContent = elapsed.toFixed(1) + 's';
      if (elapsed >= FAST_TIME) {
        timerText.className = 'timer-text slow';
      } else {
        timerText.className = 'timer-text fast';
      }
    }, 100);
  }

  function stopTimer() {
    clearInterval(timerInterval);
    return (performance.now() - questionStart) / 1000;
  }

  function showFeedback(isCorrect, correctAnswer) {
    if (isCorrect) {
      feedback.innerHTML = '✅';
    } else {
      feedback.innerHTML = '❌<div class="fb-sub">Answer: ' + correctAnswer + '</div>';
    }
    feedback.className = 'feedback-overlay show ' + (isCorrect ? 'correct' : 'wrong');
    setTimeout(() => { feedback.className = 'feedback-overlay'; }, isCorrect ? 500 : 1200);
  }

  function showProblem() {
    if (currentIndex >= problems.length) {
      showResults();
      return;
    }
    const [a, b] = problems[currentIndex];
    // randomly swap display order so it's not always "chosenNumber × f"
    if (Math.random() < 0.5) {
      problemText.textContent = a + ' × ' + b;
    } else {
      problemText.textContent = b + ' × ' + a;
    }
    currentAnswer = '';
    updateAnswerDisplay();
    progressFill.style.width = ((currentIndex / problems.length) * 100) + '%';
    startTimer();
  }

  function submitAnswer() {
    if (currentAnswer === '') return;
    const elapsed = stopTimer();
    const [a, b] = problems[currentIndex];
    const correct = a * b;
    const given = parseInt(currentAnswer, 10);
    const isCorrect = given === correct;

    results.push({ a, b, correct, given, time: elapsed, isCorrect });
    showFeedback(isCorrect, correct);

    currentIndex++;
    setTimeout(showProblem, isCorrect ? 400 : 1200);
  }

  function autoSubmitIfCorrect() {
    if (currentIndex >= problems.length) return;
    const [a, b] = problems[currentIndex];
    const correct = a * b;
    if (currentAnswer === String(correct)) {
      submitAnswer();
    }
  }

  // --- Countdown ---
  function runCountdown(cb) {
    showScreen(screenCountdown);
    let count = 3;
    countdownText.textContent = count;
    const iv = setInterval(() => {
      count--;
      if (count > 0) {
        countdownText.textContent = count;
      } else if (count === 0) {
        countdownText.textContent = 'GO!';
      } else {
        clearInterval(iv);
        cb();
      }
    }, 700);
  }

  // --- Results screen ---
  function showResults() {
    stopTimer();
    progressFill.style.width = '100%';

    const fast = results.filter(r => r.isCorrect && r.time < FAST_TIME);
    const correctSlow = results.filter(r => r.isCorrect && r.time >= FAST_TIME);
    const wrong = results.filter(r => !r.isCorrect);

    const pct = Math.round((results.filter(r => r.isCorrect).length / results.length) * 100);
    if (pct === 100 && fast.length === results.length) {
      resultsHeader.textContent = '🏆 PERFECT — Lightning Fast!';
    } else if (pct === 100) {
      resultsHeader.textContent = '🎉 All Correct!';
    } else if (pct >= 80) {
      resultsHeader.textContent = '💪 Almost There!';
    } else {
      resultsHeader.textContent = '📚 Keep Practicing!';
    }

    scoreSummary.innerHTML = `
      <div class="score-box green">
        <div class="num">${fast.length}</div>
        <div class="label">⚡ Fast &lt; ${FAST_TIME}s</div>
      </div>
      <div class="score-box yellow">
        <div class="num">${correctSlow.length}</div>
        <div class="label">✓ Correct</div>
      </div>
      <div class="score-box red">
        <div class="num">${wrong.length}</div>
        <div class="label">✗ Wrong</div>
      </div>
    `;

    // Sort: wrong first, then slow-correct, then fast
    const sorted = [...wrong, ...correctSlow, ...fast];

    resultsList.innerHTML = sorted.map(r => {
      let cls, icon;
      if (!r.isCorrect) {
        cls = 'wrong'; icon = '✗';
      } else if (r.time < FAST_TIME) {
        cls = 'fast'; icon = '⚡';
      } else {
        cls = 'correct'; icon = '✓';
      }
      const wrongText = r.isCorrect
        ? ''
        : `<span style="color:var(--accent);margin-left:4px">(you said ${r.given})</span>`;
      return `<div class="result-row ${cls}">
        <span class="icon">${icon}</span>
        <span class="problem-text">${r.a} × ${r.b} = ${r.correct} ${wrongText}</span>
        <span class="time-text">${r.time.toFixed(1)}s</span>
      </div>`;
    }).join('');

    showScreen(screenResults);
  }

  // --- Start a round ---
  function startGame(num) {
    chosenNumber = num;
    problems = generateProblems(num);
    currentIndex = 0;
    results = [];
    runCountdown(() => {
      showScreen(screenQuiz);
      showProblem();
    });
  }

  // --- Event listeners ---

  // Number picker buttons
  document.querySelectorAll('.pick-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const val = btn.dataset.num;
      startGame(val === 'all' ? 'all' : parseInt(val, 10));
    });
  });

  // Numpad buttons
  document.getElementById('numpad').addEventListener('click', (e) => {
    const btn = e.target.closest('.num-btn');
    if (!btn) return;
    const val = btn.dataset.val;

    if (val === 'del') {
      currentAnswer = currentAnswer.slice(0, -1);
      updateAnswerDisplay();
    } else if (val === 'go') {
      submitAnswer();
    } else {
      if (currentAnswer.length < 3) { // max 3 digits (up to 108)
        currentAnswer += val;
        updateAnswerDisplay();
        autoSubmitIfCorrect();
      }
    }
  });

  // Keyboard support (for parents testing 😉)
  document.addEventListener('keydown', (e) => {
    if (!screenQuiz.classList.contains('active')) return;
    if (e.key >= '0' && e.key <= '9') {
      if (currentAnswer.length < 3) {
        currentAnswer += e.key;
        updateAnswerDisplay();
        autoSubmitIfCorrect();
      }
    } else if (e.key === 'Backspace') {
      currentAnswer = currentAnswer.slice(0, -1);
      updateAnswerDisplay();
    } else if (e.key === 'Enter') {
      submitAnswer();
    }
  });

  // Results buttons
  btnHome.addEventListener('click', () => showScreen(screenPick));
  btnRetry.addEventListener('click', () => startGame(chosenNumber));

})();
</script>
</body>
</html>
